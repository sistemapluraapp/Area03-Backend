name = "area03-backend"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://uoembacxxnkuwldmdgcu.supabase.co"
# A anon/publishable key do Supabase é feita para ser pública (protegida
# pelo RLS, não por sigilo) — é a mesma usada nos frontends. Por isso vive
# aqui como var normal, não como secret.
SUPABASE_ANON_KEY = "sb_publishable_LHnLAUk6M4ek94aokap89g__nL-ySby"
AREA = "03"
FRONTEND_URL = "https://gov.plura.app.br"
EMAIL_REMETENTE = "Plura <nao-responda@plura.app.br>"


# Arquivos das inscrições em certificações (8c), até 25 MB cada
[[r2_buckets]]
binding = "CERTIFICACOES"
bucket_name = "plura-certificacoes"


# Limite de tentativas por IP (src/lib/limite.ts): 20 por minuto em login,
# cadastro, senha e convites. namespace_id é único por Worker na conta.
[[unsafe.bindings]]
name = "LIMITE"
type = "ratelimit"
namespace_id = "1103"
simple = { limit = 20, period = 60 }

# Ambiente de teste (branches claude/clever-knuth-bx0368 e claude/stoic-babbage-0gea8e): Worker separado,
# area03-backend-teste. Publicado por .github/workflows/deploy-teste.yml
[env.teste]
name = "area03-backend-teste"

[env.teste.vars]
SUPABASE_URL = "https://uoembacxxnkuwldmdgcu.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_LHnLAUk6M4ek94aokap89g__nL-ySby"
AREA = "03"
FRONTEND_URL = "https://teste.area03-frontend.pages.dev"
EMAIL_REMETENTE = "Plura <nao-responda@plura.app.br>"

[[env.teste.r2_buckets]]
binding = "CERTIFICACOES"
bucket_name = "plura-certificacoes-teste"

[[env.teste.unsafe.bindings]]
name = "LIMITE"
type = "ratelimit"
namespace_id = "2103"
simple = { limit = 20, period = 60 }
